name: Discord Biweekly Alert 

on:
  # Memungkinkan pemicu dari luar via API / Webhook (cron-job.org)
  repository_dispatch:
    types: [trigger-discord-alert]
  # Memungkinkan pengujian manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  send-discord-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Cek Selang 2 Minggu (Minggu Ganjil)
        id: check-week
        run: |
          WEEK_NUM=$(date +%V)
          echo "Nomor minggu saat ini: $WEEK_NUM"
          
          # Memeriksa apakah minggu GANJIL (sisa bagi tidak sama dengan 0)
          if [ $((10#$WEEK_NUM % 2)) -ne 0 ]; then
            echo "Kondisi terpenuhi (Minggu Ganjil)!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Kondisi TIDAK terpenuhi (Minggu Genap). Lewati eksekusi."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Kirim Pesan Webhook Discord
        if: steps.check-week.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "content": "<@&1513954878777594027>",
                 "allowed_mentions": {
                   "roles": ["1513954878777594027"]
                 },
                 "embeds": [
                   {
                     "color": 16711680,
                     "title": "Reminds you",
                     "description": "⚔️ **Core World  **\n⏳ **Status : 10 Menit lagi **\n",
                     "footer": {
                       "text": "RF Alert System"
                     }
                   }
                 ]
               }' \
               "$DISCORD_WEBHOOK_URL"
